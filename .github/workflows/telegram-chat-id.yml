name: Get Telegram Chat ID

on:
  workflow_dispatch:

jobs:
  get-chat-id:
    runs-on: ubuntu-latest
    steps:
      - name: Get Chat ID
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          curl -fsS "https://api.telegram.org/bot${TOKEN}/getUpdates" |
          jq '.result[] | select(.message.chat.type == "private") | .message.chat.id'
